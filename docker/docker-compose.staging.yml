# BookOne — Staging stack (one Portainer stack, selective app services)
# Compose path in Portainer: docker/docker-compose.staging.yml
#
# ── Selective builds (turn services on/off) ─────────────────────────────
# Always on: traefik, web, postgres, redis, minio, cloudflared
# Optional: docs — COMPOSE_PROFILES=docs
#
# Fresh staging: empty VPS, data loss accepted.
# Web image is built in GitHub Actions ("Docker web image") and pushed to GHCR.
# Portainer only pulls ghcr.io/dinu-sri/bookone-web:latest — it does not compile Next.js.
# Wait for that Action to go green, then Update with Re-pull ON.
# Infra uses pull_policy: missing so Re-pull does not replace postgres/redis/minio.
# Docker Hub no longer serves minio/minio — use chainguard/minio.
#
# Hosts (one subdomain level under clossyan.com for free SSL):
#   WEB_HOST=bookone.clossyan.com
#   WEB_HOST_TEST=staging.clossyan.com  (second host for agent/QA test accounts; same app)
#   DOCS_HOST=bookone-docs.clossyan.com
# Browser tests live in https://github.com/Dinu-Sri/bookone-qa (not an ERP service).

services:
  traefik:
    image: traefik:v3
    pull_policy: missing
    container_name: bookone-staging-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - bookone_network
    restart: unless-stopped

  # ── ERP — GHCR image only. Do not add `build:` (that compiles on the VPS).
  # Do not use a local name like bookone_stage-web (Hub 401).
  web:
    image: ghcr.io/dinu-sri/bookone-web:latest
    pull_policy: always
    container_name: bookone-staging-web
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # CoreGuard maintenance login (bookone_maintenance): archive restore only. Guide §4.6, owner action B4.
      - MAINTENANCE_DATABASE_URL=${MAINTENANCE_DATABASE_URL:-}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - AUTH_URL=${AUTH_URL:-https://bookone.clossyan.com}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://bookone.clossyan.com}
      # Every host Traefik routes to web must be trusted, or Better Auth rejects sign-in (invalid origin).
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-https://bookone.clossyan.com,https://staging.clossyan.com}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - OPS_LOG_SECRET=${OPS_LOG_SECRET:-}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NODE_ENV=production
      # AgentBridge BookOne-as-AS. Usual Portainer Re-pull is enough: the web process
      # generates a PKCS8 RSA key once into the named volume and reuses it.
      # Optional stack overrides: PUBLIC_URL, ISSUER, KID. Leave AGENT_BRIDGE_ALLOW_HMAC unset.
      # Do not bind-mount a missing host file (Docker would create a directory).
      - AGENT_BRIDGE_PUBLIC_URL=${AGENT_BRIDGE_PUBLIC_URL:-https://bookone.clossyan.com}
      - AGENT_BRIDGE_OAUTH_ISSUER=${AGENT_BRIDGE_OAUTH_ISSUER:-https://bookone.clossyan.com}
      - AGENT_BRIDGE_OAUTH_KID=${AGENT_BRIDGE_OAUTH_KID:-bookone-staging-agentbridge-01}
      - AGENT_BRIDGE_OAUTH_SIGNING_PEM=${AGENT_BRIDGE_OAUTH_SIGNING_PEM:-}
      - AGENT_BRIDGE_OAUTH_SIGNING_PEM_FILE=${AGENT_BRIDGE_OAUTH_SIGNING_PEM_FILE:-/var/lib/bookone/secrets/agent_bridge_oauth_signing.pem}
    volumes:
      - agent_bridge_signing:/var/lib/bookone/secrets
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookone-web.rule=Host(`${WEB_HOST:-bookone.clossyan.com}`) || Host(`${WEB_HOST_TEST:-staging.clossyan.com}`)"
      - "traefik.http.routers.bookone-web.entrypoints=web"
      - "traefik.http.routers.bookone-web.priority=1"
      - "traefik.http.services.bookone-web.loadbalancer.server.port=3100"
    networks:
      - bookone_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Docs: reverse-proxy to web Fumadocs (cheap nginx — optional profile) ─
  # Enable with COMPOSE_PROFILES=docs. Fast to rebuild.
  docs:
    profiles: ["docs", "full"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.docs
    container_name: bookone-staging-docs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookone-docs.rule=Host(`${DOCS_HOST:-bookone-docs.clossyan.com}`)"
      - "traefik.http.routers.bookone-docs.entrypoints=web"
      - "traefik.http.routers.bookone-docs.priority=100"
      - "traefik.http.services.bookone-docs.loadbalancer.server.port=80"
    networks:
      - bookone_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    pull_policy: missing
    container_name: bookone-staging-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookone_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: bookone-staging-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookone_network
    restart: unless-stopped

  minio:
    # Docker Hub removed minio/minio. Chainguard is a pullable S3-compatible server.
    image: chainguard/minio:latest
    pull_policy: missing
    container_name: bookone-staging-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - bookone_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: missing
    container_name: bookone-staging-cloudflared
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bookone_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt_data:
  agent_bridge_signing:

networks:
  bookone_network:
    driver: bridge
