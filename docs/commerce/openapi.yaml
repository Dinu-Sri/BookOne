openapi: 3.1.0
info:
  title: BookOne Commerce API
  version: 1.0.0
  description: >
    v1 single-store, single-location, single-currency commerce contract.
    HTTP 2xx means the request was accepted for processing. Accounting and stock
    effects are confirmed by reading the order, inventory, and journals.
    Reservation endpoints stay disabled. Keep the bearer token on the server.
    Never put it in a theme file or shopper HTML. GET /products stays mapped-only.
    BookOne-first publish uses /catalog/candidates plus /catalog/acknowledge.
    Canonical source: packages/commerce/src/openapi.ts. Dated with BookOne 2.17.0.
servers:
  - url: /api/commerce/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bkc
  schemas:
    Error:
      type: object
      required: [ok, code, error, requestId]
      properties:
        ok: { type: boolean, enum: [false] }
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION
            - RATE_LIMITED
            - INBOUND_PAUSED
            - OUTBOUND_PAUSED
            - RESERVATION_DISABLED
            - CURSOR_EXPIRED
            - UNSUPPORTED
        error: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    Connection:
      type: object
      required: [id, name, kind, environment, currency, scopes, apiVersion]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [woocommerce, custom_website] }
        environment: { type: string, enum: [sandbox, live] }
        locationId: { type: [string, "null"] }
        currency: { type: string, example: LKR }
        scopes:
          type: array
          items: { type: string, enum: [catalog, inventory, order, lifecycle] }
        postingMode: { type: string, enum: [preview, posting] }
        inboundPaused: { type: boolean }
        outboundPaused: { type: boolean }
        oversellPolicy: { type: string, enum: [review] }
        reservationMode: { type: string, enum: [disabled] }
        capabilities:
          type: object
          properties:
            catalog: { type: boolean }
            inventory: { type: boolean }
            orders: { type: boolean }
            lifecycle: { type: boolean }
            reservations: { type: boolean, enum: [false] }
            priceExport: { type: boolean, enum: [false] }
        serviceTime: { type: string, format: date-time }
        apiVersion: { type: string, enum: [v1] }
    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, sku, name, externalProductId]
            properties:
              id: { type: string }
              sku: { type: string }
              name: { type: string }
              unit: { type: string }
              revision: { type: integer }
              archived: { type: boolean }
              externalProductId: { type: string }
              externalVariantId: { type: string }
        nextCursor: { type: [string, "null"] }
    Inventory:
      type: object
      required: [items, authority, mode]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sku, quantity, revision]
            properties:
              sku: { type: string }
              productId: { type: string }
              locationId: { type: [string, "null"] }
              quantity: { type: string, example: "1" }
              revision: { type: integer }
              asOf: { type: string, format: date-time }
              stale: { type: boolean }
        authority: { type: string, enum: [bookone] }
        mode: { type: string, enum: [absolute] }
    Changes:
      type: object
      required: [items, nextCursor, fullResync]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              revision: { type: integer }
              kind: { type: string, enum: [catalog, inventory] }
              sku: { type: string }
              payload: { type: object, additionalProperties: true }
        nextCursor: { type: string }
        fullResync: { type: boolean }
    CatalogCandidates:
      type: object
      required: [items, bootstrap, mappedOnlyProductsPath]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              claimId: { type: string }
              bookoneProductId: { type: string }
              sku: { type: string }
              name: { type: string }
              unit: { type: string }
              sellPrice: { type: string }
              status: { type: string }
              alreadyLinked: { type: boolean }
        bootstrap: { type: string, enum: [idle, queued] }
        defaultWooStatus: { type: string, enum: [draft] }
        mappedOnlyProductsPath: { type: string, enum: [/products] }
    Acknowledgement:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [bookoneProductId, externalProductId]
            properties:
              bookoneProductId: { type: string }
              claimId: { type: string }
              externalProductId: { type: string }
              externalVariantId: { type: string }
    AcknowledgementReceipt:
      type: object
      required: [ok, items]
      properties:
        ok: { type: boolean, enum: [true] }
        items:
          type: array
          items:
            type: object
            properties:
              bookoneProductId: { type: string }
              status: { type: string, enum: [acknowledged] }
              replayed: { type: boolean }
              externalProductId: { type: string }
    Order:
      type: object
      required: [externalId, currency, placedAt, customer, lines, total]
      properties:
        externalId: { type: string }
        currency: { type: string, example: LKR }
        placedAt: { type: string, format: date-time }
        sourceTimezone: { type: string, example: Asia/Colombo }
        sourceVersion: { type: string }
        customer:
          type: object
          required: [name]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [externalLineId, sku, quantity, unitPrice]
            properties:
              externalLineId: { type: string }
              sku: { type: string }
              quantity: { type: string, example: "1" }
              unitPrice: { type: string, example: "1500.00" }
              taxAmount: { type: string }
              discountAmount: { type: string }
              description: { type: string }
        shippingAmount: { type: string }
        discountAmount: { type: string }
        taxAmount: { type: string }
        total: { type: string, example: "1500.00" }
        payment:
          type: object
          properties:
            status: { type: string, enum: [pending, paid, failed] }
            method: { type: string }
            amount: { type: string }
            externalRef: { type: string }
        status: { type: string, enum: [pending, paid, cancelled] }
    OrderEvent:
      type: object
      required: [externalEventId, kind, effectiveAt]
      properties:
        externalEventId: { type: string }
        kind: { type: string, enum: [paid, cancelled, fulfilled, refunded] }
        sourceVersion: { type: string }
        effectiveAt: { type: string, format: date-time }
        amount: { type: string }
        restock: { type: boolean }
        externalRefundId: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [externalLineId]
            properties:
              externalLineId: { type: string }
              quantity: { type: string }
              amount: { type: string }
    OrderReceipt:
      type: object
      required: [ok, status, externalId, httpStatusIsNotAccountingAcceptance]
      properties:
        ok: { type: boolean, enum: [true] }
        requestId: { type: string }
        processing: { type: string }
        status:
          type: string
          enum:
            - received
            - needs_review
            - accepted
            - posted
            - paid
            - cancelled
            - fulfilled
            - refunded
            - partially_refunded
            - failed
        externalId: { type: string }
        reviewReason: { type: [string, "null"] }
        documentId: { type: [string, "null"] }
        documentNumber: { type: [string, "null"] }
        lastAppliedVersion: { type: [string, "null"] }
        settlement: { type: string, enum: [none, not_configured, settled] }
        replayed: { type: boolean }
        httpStatusIsNotAccountingAcceptance: { type: boolean, enum: [true] }
    ValidatePreview:
      type: object
      properties:
        ok: { type: boolean }
        issues:
          type: array
          items: { type: string }
        mapped:
          type: array
          items: { type: object, additionalProperties: true }
paths:
  /connection:
    get:
      summary: Connection identity, scopes and capabilities
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /products:
    get:
      summary: Mapped products and variants only
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Mapped products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
  /catalog/candidates:
    get:
      summary: Feature-gated BookOne-first publish queue. Empty unless an operator queued products.
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCandidates" }
  /catalog/acknowledge:
    post:
      summary: Report stable external product IDs after the store created listings
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acknowledgement" }
      responses:
        "200":
          description: Mapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcknowledgementReceipt" }
        "409":
          description: Conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /inventory:
    get:
      summary: Absolute BookOne availability
      parameters:
        - name: sku
          in: query
          style: form
          explode: true
          schema: { type: string }
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inventory" }
        "409":
          description: Outbound paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /changes:
    get:
      summary: Resumable catalog and stock changes
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changes" }
        "422":
          description: Cursor expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/validate:
    post:
      summary: Side-effect-free order preview
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidatePreview" }
  /orders:
    post:
      summary: Durable order submit
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
        "409":
          description: Conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{externalId}:
    get:
      summary: Store-visible order status
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{externalId}/events:
    post:
      summary: "Supported lifecycle events: paid, cancelled, fulfilled, refunded"
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderEvent" }
      responses:
        "202":
          description: Event applied or staged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
  /reservations:
    post:
      summary: Disabled until a contention test passes
      responses:
        "422":
          description: Reservation disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /openapi.json:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: OpenAPI
